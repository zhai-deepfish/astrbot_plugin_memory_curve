name: astrbot_plugin_memory_curve
display_name: 潮汐记忆
short_desc: 对话越聊越长，记忆越用越准
desc: |
  **潮汐记忆** 给聊天窗口做减法，给长期记忆做加法。

  四层记忆模型：
  - **L1 最近对话**：保留最近若干轮原文，保证话说得上下连贯
  - **L2 短期摘要**：每轮用便宜模型判一次重要性，顺手压成一句话，默认 24 小时过期
  - **L3 长期事实**：分数够高的事实（身份、偏好、约定、明确要求记住的事）沉淀下来，默认保留 30 天，本轮提到过就自动续期
  - **L4 全量存档**：所有对话按天写进 jsonl，说「之前那事」时按关键词检索回来

  好处是上下文能从几十万 token 压到几千，主模型只管说话，判定交给便宜模型。
  管理员可以用「记忆 列表 / 加 / 改 / 删 / 清理」手动纠正长期记忆，改之前会自动备份。

  同一件事只留一条（L2/L3 都做了判重），重载插件不会重复提升，一次性任务不会被塞进长期记忆。
help: |
  四层记忆：L1 最近对话原文 / L2 短期摘要 / L3 长期事实 / L4 全量存档。
  每轮用便宜模型判一次重要性并生成短摘要，主模型只负责说话。
  上下文会从几十万压到几千 token。
  管理员可用「记忆 列表 / 加 / 改 / 删 / 清理」手动纠正长期记忆。
version: 1.0.3
author: 宅家大肥鱼
repo: https://github.com/zhai-deepfish/astrbot_plugin_memory_curve
